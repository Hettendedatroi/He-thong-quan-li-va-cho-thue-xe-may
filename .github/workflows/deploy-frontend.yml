name: Deploy Angular to Pages

on:
  push:
    branches: [main]
    paths: ["moto-rental-web/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        working-directory: moto-rental-web
        run: |
          npm install
          npx ng build --base-href /He-thong-quan-li-va-cho-thue-xe-may/

      - name: Copy index.html to 404.html
        run: |
          cd moto-rental-web/dist/*/browser
          cp index.html 404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: moto-rental-web/dist/moto-rental-web/browser

      - id: deployment
        uses: actions/deploy-pages@v4
