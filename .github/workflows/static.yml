name: Manually deploy Angular to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: moto-rental-web/package-lock.json

      - name: Build Angular
        working-directory: moto-rental-web
        run: |
          npm ci
          npm run build -- --base-href /He-thong-quan-li-va-cho-thue-xe-may/

      - name: Copy index.html to 404.html
        run: cp moto-rental-web/dist/moto-rental-web/browser/index.html moto-rental-web/dist/moto-rental-web/browser/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: moto-rental-web/dist/moto-rental-web/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
